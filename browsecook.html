<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Chefs - RannaBari</title>
    <meta name="description" content="Discover the finest local culinary artisans.">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Kinetic Background -->
    <div class="kinetic-bg"></div>
    <div class="ambient-glow glow-top-right"></div>
    
    <!-- Navigation (Liquid Glass Light) -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <span>🍛</span> RANNA<span class="text-primary-gradient">BARI</span>
            </a>
            <div class="nav-links">
                <a href="browsecook.html" class="nav-link active">Browse Cooks</a>
                <div class="location-pill">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Location off
                </div>
                <a href="cart.html" class="nav-icon" style="position: relative;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-badge">2</span>
                </a>
                <button class="theme-toggle" id="themeToggle" title="Toggle Midnight Dining" style="margin-left: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Browse Content -->
    <main class="section" style="padding-top: 160px;">
        <div class="container">
            <div class="section-header" style="flex-direction: column; align-items: flex-start; margin-bottom: 32px;">
                <h1 class="section-title">DISCOVER <span class="text-primary-gradient">ARTISANS</span></h1>
                <p style="color: var(--color-text-muted); font-size: 18px; margin-top: 8px;">Find the perfect meal curated by local chefs.</p>
            </div>
            
            <div class="filter-bar" style="align-items: center;">
                <div class="search-pill" style="flex: 1; min-width: 300px;">
                    <svg style="margin-left:12px; color:var(--color-text-muted);" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Search cuisines, chefs, or areas...">
                </div>
                <div class="flex gap-4" style="overflow-x: auto;" id="categoryFilters">
                    <button class="filter-pill active" data-filter="all">ALL</button>
                    <button class="filter-pill" data-filter="breakfast">MORNING</button>
                    <button class="filter-pill" data-filter="lunch">LUNCH</button>
                    <button class="filter-pill" data-filter="dinner">EVENING</button>
                    <button class="filter-pill" data-filter="healthy">HEALTHY</button>
                </div>
                <div class="search-pill">
                    <select id="areaFilter" style="border: none; background: transparent; padding: 0 16px; font-weight: 600; cursor: pointer; color: var(--color-text); outline: none;">
                        <option value="all">All Areas</option>
                        <option value="dhanmondi">Dhanmondi</option>
                        <option value="mirpur">Mirpur</option>
                        <option value="uttara">Uttara</option>
                        <option value="banani">Banani</option>
                    </select>
                </div>
                <a href="map.html" class="search-pill" style="padding: 10px; border-radius: var(--radius-pill); cursor: pointer; color: var(--color-primary); box-shadow: 0 4px 15px rgba(200, 75, 49, 0.15); text-decoration: none; display: flex; justify-content: center; align-items: center;" title="View on Map">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                </a>
            </div>
            
            <div id="resultsCount" style="color: var(--color-text-muted); font-size: 14px; font-weight: 700; letter-spacing: 1px; margin-bottom: 32px; text-transform: uppercase;">Loading Artisans...</div>
            
            <div class="cook-grid" id="browse-chefs-grid">
                <!-- Dynamically populated from js/app.js -->
            </div>
        </div>
    </main>

    <footer class="footer" style="padding-bottom: 120px;">
        <div class="container">
            <div class="nav-brand" style="justify-content: center; margin-bottom: 24px; font-size: 20px;">
                <span>🍛</span> RANNA<span class="text-primary-gradient">BARI</span>
            </div>
            <p style="color: var(--color-text-light); font-size: 14px;">© 2026 RannaBari. Shaping the future of localized gastronomy with authentic flavor.</p>
        </div>
    </footer>

    <!-- Floating Bottom App Bar (Mobile First/App-like UX) -->
    <nav class="bottom-app-bar">
        <a href="index.html" class="app-bar-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="browsecook.html" class="app-bar-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Browse
        </a>
        <a href="map.html" class="app-bar-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
            Map
        </a>
        <a href="singlecook.html" class="app-bar-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let allChefs = await fetchData(DB.chefs);
            
            const grid = document.getElementById('browse-chefs-grid');
            const countLabel = document.getElementById('resultsCount');
            const searchInput = document.getElementById('searchInput');
            const categoryBtns = document.querySelectorAll('#categoryFilters .filter-pill');
            
            let currentFilter = new URLSearchParams(window.location.search).get('filter') || 'all';
            let currentSearch = '';
            
            // Initial active state for filter buttons based on URL
            categoryBtns.forEach(btn => {
                if (btn.dataset.filter === currentFilter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            function render() {
                // Apply filters and search
                let filtered = allChefs.filter(chef => {
                    // Category filter
                    let matchesCategory = true;
                    if (currentFilter !== 'all') {
                        matchesCategory = chef.tags.includes(currentFilter);
                    }
                    
                    // Search filter
                    let matchesSearch = true;
                    if (currentSearch.trim() !== '') {
                        const s = currentSearch.toLowerCase();
                        matchesSearch = chef.name.toLowerCase().includes(s) || 
                                        chef.specialty.toLowerCase().includes(s) ||
                                        chef.tags.some(t => t.toLowerCase().includes(s));
                    }
                    
                    return matchesCategory && matchesSearch;
                });

                // Update UI
                if (filtered.length > 0) {
                    grid.innerHTML = filtered.map(createChefCardHTML).join('');
                } else {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--color-text-muted);">No artisans found matching your criteria.</div>`;
                }
                
                countLabel.textContent = `${filtered.length} Artisans Curated For You`;
            }

            // Bind Search Event
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                render();
            });

            // Bind Filter Click Events
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Remove active from all
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    // Add active to clicked
                    e.target.classList.add('active');
                    
                    currentFilter = e.target.dataset.filter;
                    render();
                });
            });

            // Initial render
            render();
        });
    </script>
</body>
</html>
