    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        /* Full height map layout */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling, let map handle it */
        }
        
        #fullscreen-map {
            width: 100%;
            height: calc(100vh - 100px); /* Account for navbar space */
            margin-top: 100px;
            z-index: 1;
        }

        .map-search-overlay {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
            background: var(--color-surface-solid);
            backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border: 1px solid var(--clr-line);
        }

        .map-search-overlay input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 16px;
            font-size: 16px;
            font-family: var(--font-body);
            background: transparent;
        }

        .map-search-overlay button {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow-primary);
            transition: all 0.3s ease;
        }
        
        .map-search-overlay button:hover {
            transform: translateY(-2px);
            background: var(--color-primary-hover);
        }
        
        [data-theme="dark"] .map-search-overlay {
            background: var(--clr-raised);
            border-color: var(--clr-line);
        }
        [data-theme="dark"] .map-search-overlay input {
            color: var(--color-text);
        }

        /* Dark Mode Map Filter */
        [data-theme="dark"] .leaflet-layer,
        [data-theme="dark"] .leaflet-control-zoom-in,
        [data-theme="dark"] .leaflet-control-zoom-out,
        [data-theme="dark"] .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* Keep the map clear of the bottom app bar on short viewports */
        #fullscreen-map {
            height: calc(100dvh - 100px);
        }

        @media (max-width: 768px) {
            /* The navbar is 58px tall and sits 10px from the top on phones */
            #fullscreen-map {
                margin-top: 78px;
                height: calc(100vh - 78px);
                height: calc(100dvh - 78px);
            }

            .map-search-overlay {
                top: 80px;
                width: calc(100% - 20px);
                padding: 6px 8px;
                border-radius: var(--radius-md);
            }
            .map-search-overlay > svg { display: none; }
            .map-search-overlay input {
                padding: 10px 12px;
                font-size: 16px; /* stops iOS zooming in on focus */
                min-width: 0;
            }
            .map-search-overlay button {
                padding: 10px 16px;
                font-size: 13px;
                flex-shrink: 0;
            }

            /* Push Leaflet's zoom / attribution clear of the search overlay
               and the floating app bar */
            .leaflet-top { top: 78px; }
            .leaflet-bottom { bottom: 90px; }
        }

        @media (max-width: 480px) {
            .map-search-overlay button { padding: 10px 12px; font-size: 12px; }
            .map-search-overlay input { padding: 10px 8px; }
        }
        /* Leaflet popups inherit the card language */
        .leaflet-popup-content-wrapper {
            background: var(--color-surface-solid);
            color: var(--color-text);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--clr-line);
        }
        .leaflet-popup-tip { background: var(--color-surface-solid); }
        .leaflet-popup-content h4 { font-family: var(--font-display); }
        [data-theme="dark"] .leaflet-popup-close-button { color: var(--color-text-muted) !important; }
        .map-marker {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(145deg, var(--clr-primary-300), var(--clr-primary-600));
            border: 3px solid var(--clr-raised);
            box-shadow: var(--shadow-primary);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .map-marker .ico { width: 20px; height: 20px; }
    </style>
</head>

    <!-- Map Search Overlay -->

        <svg style="margin-left: 8px; color: var(--color-primary);" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

    <!-- The Map Container -->

    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            var map = L.map('fullscreen-map').setView([23.8103, 90.4125], 12);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            var customIcon = L.divIcon({
                className: 'custom-map-marker',
                html: '<div class="map-marker"><svg class="ico" aria-hidden="true"><use href="#i-chefHat"/></svg></div>',
                iconSize: [40, 40],
                iconAnchor: [20, 20],
                popupAnchor: [0, -20]
            });

            // Fetch dynamic chefs data
            const chefs = await fetchData(DB.chefs);

            chefs.forEach(function(c) {
                if (c.lat && c.lng) {
                    var marker = L.marker([c.lat, c.lng], {icon: customIcon}).addTo(map);
                    marker.bindPopup(`
                        <div style="text-align: center; font-family: 'Inter', sans-serif; padding: 8px;">
                            <img src="${c.avatar}" style="width: 50px; height: 50px; border-radius: 50%; margin-bottom: 8px; object-fit: cover;">
                            <h4 style="margin: 0 0 5px 0; color: var(--color-text); font-family: 'Outfit', sans-serif; font-size: 20px;">${c.name}</h4>
                            <p style="margin: 0 0 15px 0; font-size: 14px; color: var(--color-text-muted);">${c.specialty}</p>
                            <a href="singlecook.html?id=${c.id}" style="background: var(--color-primary); color: white; display: inline-block; padding: 10px 24px; font-size: 14px; font-weight: bold; text-decoration: none; border-radius: 30px; box-shadow: 0 4px 12px rgba(200, 75, 49, 0.3); transition: all 0.3s ease;">View Menu & Order</a>
                        </div>
                    `, { minWidth: 200 });
                }
            });
        });
    </script>
